<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading note… — Engineering Knowledge Base</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="viewer-shell">
  <div class="viewer-bar">
    <a class="back-link" id="back-sub" href="#">← Back</a>
    <div class="divider"></div>
    <a class="back-link" id="back-cat" href="#">Category</a>
    <div class="divider"></div>
    <div class="note-title" id="note-title">Loading…</div>
    <span class="pill" id="note-level"></span>
    <div class="viewer-progress-controls">
      <select id="progress-select" title="Learning progress">
        <option value="not-started">Not Started</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>
      <button class="fav-btn" id="fav-toggle" title="Toggle favorite">☆</button>
    </div>
  </div>
  <div class="viewer-frame-wrap">
    <!--
      The note is rendered inside this iframe as its own independent HTML
      document. Its CSS, layout, scripts, tables, images, and Table of
      Contents are left completely untouched — the wrapper above only adds
      navigation chrome around it.
    -->
    <iframe id="note-frame" title="Study note" sandbox="allow-scripts allow-same-origin allow-popups"></iframe>
  </div>
</div>
<script src="js/storage.js"></script>
<script src="js/note-viewer.js"></script>
</body>
</html>
