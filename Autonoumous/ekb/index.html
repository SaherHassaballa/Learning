<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Knowledge Base</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="mark">EK</div>
      <div class="name" id="brand-name">Engineering Knowledge Base
        <small id="brand-sub">My Personal Technical Study Library</small>
      </div>
    </div>
    <nav id="sidebar-nav"></nav>
    <div class="nav-group">
      <div class="group-head">Manage</div>
      <a class="sub-link" href="add-note.html">＋ Add Note</a>
    </div>
  </aside>
  <div class="sidebar-scrim" id="sidebar-scrim"></div>

  <header class="topbar">
    <button class="menu-btn" id="menu-btn" aria-label="Toggle menu">☰</button>
    <div class="searchbar">
      <span class="icon">🔎</span>
      <input id="search-input" type="text" placeholder="Search notes, topics, categories..." autocomplete="off">
    </div>
    <div class="topbar-spacer"></div>
    <button class="theme-toggle" id="theme-toggle">☾ Dark</button>
  </header>

  <main class="main" id="app">
    <!-- rendered by js/app.js -->
  </main>

</div>

<script src="js/storage.js"></script>
<script src="js/search.js"></script>
<script src="js/app.js"></script>
</body>
</html>
